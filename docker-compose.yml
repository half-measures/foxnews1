services:
  db:
    image: postgres:17
    container_name: foxcomments-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foxcomments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foxcomments}
      POSTGRES_DB: ${POSTGRES_DB:-foxcomments}
    ports:
      # Localhost only. Change to "5432:5432" to reach it from other machines on your network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - foxcomments-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  foxcomments-pgdata:
